<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — ASMRY Soft Solution</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232F5BFF'/%3E%3Cpath d='M18 48 32 16l14 32M24 36h16' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<style>
:root{--bg:#F5F6FB;--surface:#fff;--ink:#0E1430;--muted:#556083;--line:#DFE3EF;--blue:#2F5BFF;--blue-soft:#E6ECFF;--navy:#0C1234;--teal:#12A88A;--amber:#E58B10;--coral:#E5483B;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--sans:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#080C22;--surface:#10173A;--ink:#EEF0FF;--muted:#A3ACD6;--line:#232D5E;--blue:#6E8BFF;--blue-soft:#1B2557;--teal:#3DD1AE;--amber:#FFB547;--coral:#FF7B6E;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
.bar{max-width:1200px;margin:0 auto;padding:0 1.25rem;height:66px;display:flex;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:.65rem;margin-right:auto;text-decoration:none;color:#fff}
.mark{width:36px;height:36px;border-radius:11px;background:#2F5BFF;display:grid;place-items:center}
.logo b{font:800 1.1rem var(--display)}.logo small{display:block;font-size:.75rem;color:#A9B2DC}
.who{font-size:.88rem;color:#A9B2DC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1.5px solid transparent;border-radius:11px;padding:.6rem 1rem;font-weight:600;font-size:.92rem;text-decoration:none;background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:#2F5BFF;color:#fff;border-color:#2F5BFF}
.btn.ok{background:var(--teal);color:#fff;border-color:transparent}
.btn.warn{color:var(--amber)}
.btn.del{color:var(--coral)}
.btn:disabled{opacity:.5;cursor:default}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
main{max-width:1200px;margin:0 auto;padding:1.75rem 1.25rem 4rem}
.center{min-height:70vh;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2rem;max-width:460px;width:100%;text-align:center}
.card h1{font:800 1.6rem var(--display);margin:0 0 .4rem}
.card p{color:var(--muted);margin:0 0 1.4rem}
.card .btn{width:100%;padding:.85rem}
h1.page{font:800 clamp(1.6rem,3vw,2.1rem) var(--display);margin:0 0 1.25rem;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem;margin-bottom:1.75rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem}
.stat small{display:block;color:var(--muted);font-size:.85rem}
.stat b{display:block;font:800 1.9rem/1.15 var(--display);margin-top:.2rem}
.stat.hl{border-color:var(--amber)}
.tabs{display:flex;gap:.4rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.tab{background:none;border:0;padding:.75rem 1rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:#2F5BFF}
.tab span{display:inline-block;min-width:22px;padding:0 .4rem;margin-left:.35rem;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:.78rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .9rem;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:.8rem}
.item{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.2rem 1.3rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.item h3{margin:0;font-size:1.02rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.meta{color:var(--muted);font-size:.86rem;margin-top:.15rem}
.msg{margin:.7rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.badge{font-size:.74rem;font-weight:700;padding:.15rem .55rem;border-radius:999px}
.b-pending,.b-new{background:#FFF1DC;color:#B26B00}.b-approved,.b-contacted{background:#E2F6F0;color:#0E8A71}.b-hidden{background:#EEF0F6;color:#555E80}
.stars{color:#F5A524;letter-spacing:1px}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:2.5rem;text-align:center;color:var(--muted)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.5rem;max-width:640px;margin:2rem auto;line-height:1.7}
.note code{background:var(--blue-soft);padding:.1rem .35rem;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:12px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:800px){.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <a class="logo" href="./"><span class="mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20 12 4l7 16"/><path d="M8.2 13.8h7.6"/></svg></span><span><b>ASMRY Admin</b><small>Website dashboard</small></span></a>
  <span class="who" id="who"></span>
  <button class="btn" id="out" hidden>Sign out</button>
</div></header>
<main id="app"><div class="center"><p>Loading…</p></div></main>
<div class="toast" id="toast" role="status"></div>

<script>
const CFG=(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/YOUR_/.test(window.FIREBASE_CONFIG.apiKey))?window.FIREBASE_CONFIG:null;
const ADMIN=(window.ADMIN_EMAIL||'').toLowerCase();
const V='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
const app=document.getElementById('app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=ts=>ts&&ts.toDate?ts.toDate().toLocaleString('en-PK',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'Just now';
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)};
const load=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)});

if(!CFG){
  app.innerHTML=`<div class="note"><h1 class="page">Connect your database</h1><p>The admin dashboard needs Firebase. Open <code>firebase-config.js</code> in your GitHub repository and paste your Firebase web app settings, then reload this page.</p></div>`;
}else{
  Promise.all([load(V+'firebase-app-compat.js')]).then(()=>Promise.all([load(V+'firebase-auth-compat.js'),load(V+'firebase-firestore-compat.js')])).then(start).catch(()=>{app.innerHTML='<div class="note">Could not load Firebase. Check your internet connection and reload.</div>'});
}

let db,FB=[],LD=[],tab='feedback',ff='pending',lf='new',unsub=[];
function start(){
  firebase.initializeApp(CFG);db=firebase.firestore();const auth=firebase.auth();
  document.getElementById('out').onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    unsub.forEach(f=>f());unsub=[];
    document.getElementById('who').textContent=u?u.email:'';document.getElementById('out').hidden=!u;
    if(!u){app.innerHTML=`<div class="center"><div class="card"><h1>Admin sign in</h1><p>Sign in with the ASMRY Google account to review customer feedback and website enquiries.</p><button class="btn primary" id="gin">Sign in with Google</button></div></div>`;
      document.getElementById('gin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>toast(e.code==='auth/unauthorized-domain'?'Add this domain in Firebase → Authentication → Settings → Authorized domains.':'Sign-in was cancelled or failed.'));return}
    if((u.email||'').toLowerCase()!==ADMIN){app.innerHTML=`<div class="center"><div class="card"><h1>No access</h1><p>${esc(u.email)} is not the admin account for this website.</p><button class="btn" onclick="firebase.auth().signOut()">Use a different account</button></div></div>`;return}
    shell();
    unsub.push(db.collection('feedback').onSnapshot(s=>{FB=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort(byDate);render()},err));
    unsub.push(db.collection('leads').onSnapshot(s=>{LD=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort(byDate);render()},err));
  });
}
const byDate=(a,b)=>((b.createdAt&&b.createdAt.seconds)||9e9)-((a.createdAt&&a.createdAt.seconds)||9e9);
const err=e=>{app.innerHTML=`<div class="note"><h1 class="page">Permission problem</h1><p>Firebase refused access (${esc(e.code||'error')}). Make sure the Firestore security rules from the setup guide are published and that you are signed in as ${esc(ADMIN)}.</p></div>`};
function shell(){app.innerHTML=`<h1 class="page">Dashboard</h1><div class="stats" id="stats"></div><div class="tabs" role="tablist"><button class="tab" role="tab" data-t="feedback">Customer feedback<span id="c1"></span></button><button class="tab" role="tab" data-t="leads">Demo enquiries<span id="c2"></span></button></div><div class="filters" id="filters"></div><div class="list" id="list"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});}
function render(){
  if(!document.getElementById('list'))return;
  const pend=FB.filter(f=>f.status==='pending').length,appr=FB.filter(f=>f.status==='approved'),nw=LD.filter(l=>l.status==='new').length;
  const avg=appr.length?(appr.reduce((a,f)=>a+(+f.rating||0),0)/appr.length).toFixed(1):'–';
  document.getElementById('stats').innerHTML=`<div class="stat ${pend?'hl':''}"><small>Feedback waiting</small><b>${pend}</b></div><div class="stat"><small>Approved reviews</small><b>${appr.length}</b></div><div class="stat"><small>Average rating</small><b>${avg}${avg!=='–'?' ★':''}</b></div><div class="stat ${nw?'hl':''}"><small>New enquiries</small><b>${nw}</b></div>`;
  document.getElementById('c1').textContent=pend;document.getElementById('c2').textContent=nw;
  app.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  const F=document.getElementById('filters'),L=document.getElementById('list');
  if(tab==='feedback'){
    F.innerHTML=[['pending','Waiting for approval'],['approved','Approved'],['hidden','Hidden'],['all','All']].map(([k,n])=>`<button class="chip" aria-pressed="${ff===k}" data-f="${k}">${n}</button>`).join('');
    F.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ff=c.dataset.f;render()});
    const rows=FB.filter(f=>ff==='all'||f.status===ff);
    L.innerHTML=rows.length?rows.map(f=>`<div class="item"><div><h3>${esc(f.name)} <span class="badge b-${esc(f.status)}">${f.status==='pending'?'Waiting':esc(f.status)}</span></h3><div class="meta"><span class="stars">${'★'.repeat(+f.rating||0)}${'☆'.repeat(5-(+f.rating||0))}</span> · ${esc([f.business,f.product].filter(Boolean).join(' · '))} · ${when(f.createdAt)}</div><p class="msg">${esc(f.message)}</p></div><div class="acts">${f.status!=='approved'?`<button class="btn ok" data-a="approve" data-id="${f.id}">Approve</button>`:''}${f.status!=='hidden'?`<button class="btn warn" data-a="hide" data-id="${f.id}">${f.status==='approved'?'Remove from site':'Hide'}</button>`:''}<button class="btn del" data-a="delf" data-id="${f.id}">Delete</button></div></div>`).join(''):`<div class="empty">${ff==='pending'?'No feedback waiting. New submissions will appear here automatically.':'Nothing here yet.'}</div>`;
  }else{
    F.innerHTML=[['new','New'],['contacted','Contacted'],['all','All']].map(([k,n])=>`<button class="chip" aria-pressed="${lf===k}" data-f="${k}">${n}</button>`).join('');
    F.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{lf=c.dataset.f;render()});
    const rows=LD.filter(l=>lf==='all'||l.status===lf);
    const wa=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='92'+d.slice(1);return d};
    L.innerHTML=rows.length?rows.map(l=>`<div class="item"><div><h3>${esc(l.name)} <span class="badge b-${esc(l.status)}">${esc(l.status)}</span></h3><div class="meta">${esc(l.phone)} · ${esc(l.product)}${l.business?' · '+esc(l.business):''} · via ${esc(l.via)} · ${when(l.createdAt)}</div>${l.message?`<p class="msg">${esc(l.message)}</p>`:''}</div><div class="acts"><a class="btn" href="https://wa.me/${wa(l.phone)}?text=${encodeURIComponent('Assalam o Alaikum '+(l.name||'')+', thank you for your interest in '+(l.product||'our software')+'. This is ASMRY Soft Solution.')}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="tel:${esc(l.phone)}">Call</a>${l.status!=='contacted'?`<button class="btn ok" data-a="contacted" data-id="${l.id}">Mark contacted</button>`:''}<button class="btn del" data-a="dell" data-id="${l.id}">Delete</button></div></div>`).join(''):`<div class="empty">${lf==='new'?'No new enquiries. Demo requests from the website will appear here.':'Nothing here yet.'}</div>`;
  }
  L.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id,b));
}
function act(a,id,b){
  b.disabled=true;let p;
  if(a==='approve')p=db.collection('feedback').doc(id).update({status:'approved'}).then(()=>toast('Approved. It now shows on the website.'));
  else if(a==='hide')p=db.collection('feedback').doc(id).update({status:'hidden'}).then(()=>toast('Hidden from the website.'));
  else if(a==='contacted')p=db.collection('leads').doc(id).update({status:'contacted'}).then(()=>toast('Marked as contacted.'));
  else if(a==='delf'||a==='dell'){if(!confirm('Delete this permanently? This cannot be undone.')){b.disabled=false;return}p=db.collection(a==='delf'?'feedback':'leads').doc(id).delete().then(()=>toast('Deleted.'))}
  p.catch(()=>{toast('That did not work. Check your connection and try again.');b.disabled=false});
}
</script>
</body>
</html>
